# ============================================================
# 因子映射表 — 英文名 / 中文名 / 详细说明
# ============================================================
# 所有界面（主UI、审视简报、微信推送、日报）的中文展示统一从本表取，
# 加载器: src/factors/naming.py（FactorNaming）。
#
# 字段约定:
#   cn      中文短名（≤4字，用于紧凑展示，"后续以中文的简单展示"即用它）
#   desc    一句话说明（表格/卡片副标题）
#   detail  详细说明：计算口径 / 数据源表 / 方向 / 级别 / 注意事项
#   category formula(公式因子) | narrative(叙事因子)
#   note    审计/体检事实快照（带日期，点状观察，可能过时）
#
# role（alpha/filter）以 config/factors.yaml 为准，FactorNaming.table() 会自动合并。

factors:
  # ---------------- 公式因子 ----------------
  zt_dt_ratio:
    cn: 涨跌比
    category: formula
    desc: 涨停/(涨停+跌停)，全市场情绪温度计
    detail: >-
      市场级因子。当日涨停家数 / (涨停家数 + 跌停家数)，跌停数由 daily_price
      跌幅>9.5% 推算。取值 0~1：接近 1 表示多头情绪极强，接近 0.5 表示多空
      拉锯，低于 0.5 表示空头主导。数据源：zt_pool + daily_price。
      全市场所有股票当日取同一个值，用于刻画大盘情绪环境而非个股选股。

  consecutive_board:
    cn: 连板高度
    category: formula
    desc: 个股连续涨停天数，接力情绪指标
    detail: >-
      个股级因子。读取当日涨停池(zt_pool)中每只股票的连续涨停天数
      (consecutive_zt)：1=首板，2=二连板，以此类推；非涨停股为空值。
      连板越高代表资金接力意愿越强，但也意味着次日开盘溢价与回撤风险同步放大。
      数据源：zt_pool。
    note: "2026-06 两段门检查：近段(30日)胜率跌破55%，处于失效观察中。"

  main_flow_intensity:
    cn: 主力强度
    category: formula
    desc: 主力净流入占成交额比，大资金参与度
    detail: >-
      个股级因子。主力净流入金额 / 当日成交额，衡量大单资金参与强度。
      正值越大说明主力买入越坚决；负值说明主力在出货。
      数据源：fund_flow（主力净流入） + daily_price（成交额）。
      注意 fund_flow 历史覆盖较稀疏，残采日会让该因子大面积缺值。

  turnover_rank:
    cn: 换手排名
    category: formula
    desc: 换手率在全市场的百分位，资金关注度
    detail: >-
      个股级因子。当日换手率在全市场的百分位排名（0~1，1=最高）；
      换手率不可用时退化为成交额排名，再退化为成交量排名。
      高换手代表筹码换手充分、资金关注度高，是短线博弈活跃度的代理。
      数据源：daily_price。

  lhb_institution:
    cn: 机构买入
    category: formula
    desc: 龙虎榜机构净买入额，专业资金信号
    detail: >-
      个股级因子。龙虎榜上榜股票的机构席位净买入额（识别"机构专用/外资机构"
      等席位关键词）；席位信息不可用时退化为整体净买入额。
      只有上榜股票有值，代表机构+游资合力方向。数据源：lhb_detail。
    note: >-
      2026-06 体检：9 因子中最活跃（T+1 真实胜率 59.4%）；决策B分层显示
      quant_led 环境下 67.0%/+8.67%，hot_money_led 环境下仅 40.4%/-0.86%，
      使用时必须看定价权 regime。近段(30日)胜率曾跌破两段门，注意时效。

  # ---------------- 叙事因子 ----------------
  theme_lifecycle:
    cn: 题材生命
    category: narrative
    desc: 题材连续涨停天数→生命周期阶段
    detail: >-
      个股级叙事因子。统计个股所属概念板块的连续活跃（涨停）天数，
      映射到生命周期阶段：萌芽(高分,可介入)→爆发(中分)→衰退(低分,规避)。
      名为"叙事"，实际消费的是量价/涨停行为数据，不读新闻文本。
      数据源：concept_daily + concept_mapping。
    note: "2026-06 体检：与 leader_clarity 在0值样本上结论雷同（中位数阈值退化），v2 拟改分位分层。"

  narrative_velocity:
    cn: 叙事速度
    category: narrative
    desc: 新闻数量3日变化率，信息传播加速度
    detail: >-
      个股级叙事因子。个股新闻量的 3 日变化率，V2 起按新闻类型加权
      （题材点燃 3.0 / 真实催化 2.0 / 发酵 1.5 / 利好兑现 -0.5 / 利空 -2.0）。
      正值越大代表叙事正在加速传播。是全系统唯一真正消费新闻文本的因子。
      数据源：news 表（akshare stock_news_em + 规则分类）。
    note: "2026-06 审计：news 表覆盖少、noise 占比高、日量波动大，数据质量评级为低。"

  theme_crowding:
    cn: 题材拥挤
    category: narrative
    desc: 题材涨停占比，越拥挤分数越低（风控项）
    detail: >-
      个股级叙事因子（决策D：role=filter，风控否决项，不参与打分）。
      个股所属题材的涨停家数占全市场涨停的比例，占比越高越拥挤、
      分数越低（反拥挤）。拥挤的题材容易发生踩踏，用作过滤而非收益来源。
      数据源：zt_pool + concept_mapping。

  leader_clarity:
    cn: 龙头清晰
    category: narrative
    desc: 龙头/二号成交额比，龙头辨识度
    detail: >-
      个股级叙事因子。同一题材内龙头成交额 / 第二名成交额，
      比值越大说明龙头越清晰、资金合力越集中（>2 通常视为辨识度高）。
      同时是定价权 regime（决策B PricingRegimeDetector）的核心输入之一
      （leader_clarity p75 + 连板高度衰减斜率 → 游资/量化主导判定）。
      数据源：zt_pool + concept_mapping。
    note: "2026-06 体检：0值样本占比高导致中位数阈值退化，与题材生命雷同，待 v2 分位分层。"
